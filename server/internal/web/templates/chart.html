<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chart {{.DeviceID}}</title>
<link rel="stylesheet" href="/css/site.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
<div class="dashboard">
  <div class="item" id="temperature">– C</div>
  <div class="item" id="humidity">– %</div>
  <div class="item" id="ppm">– ppm</div>
  <div class="item" id="voc">– voc</div>
  <div class="item" id="pressure">– hPa</div>
  <div class="item" id="vibration">– m/s²</div>
</div>
<div id="chart" class="chart"></div>
<script>
// A sensor is measured in one of two ways, and the difference decides how it has to
// be drawn.
//
//   continuous - sampled forever, so it is dense and always has a current value.
//                lttb downsamples it to roughly pixel density, preserving peaks and
//                re-sampling per zoom level so detail returns as you zoom in, and
//                large engages the bulk-render path as streaming grows the series.
//                Markers on every point would just be noise.
//
//   discrete   - only measured while something is happening, so it is a handful of
//                short bursts separated by hours of no measurement at all. Joining
//                the last reading of one burst to the first of the next draws a line
//                across those hours, so splitOnGaps splices in a null to break it.
//                lttb is off: it resamples on a fixed frame and can drop exactly
//                those nulls, and a sparse series does not need it. Markers stay on,
//                because a burst that downsampling reduces to a single point draws
//                nothing at all as a bare line segment.
const DRAW = {
  continuous: {
    prepare: points => points,
    options: { showSymbol: false, sampling: 'lttb', large: true },
  },
  discrete: {
    prepare: splitOnGaps,
    options: { showSymbol: true, symbolSize: 3, connectNulls: false },
  },
};

// Every per-sensor decision lives here: which axis it gets, the unit and precision
// of its KPI, and how it is drawn. Everything below only maps over this table, so
// adding a sensor is one row -- and the y-axes, colours, legend and yAxisIndex all
// derive from this order by construction rather than by being kept in step by hand.
const SERIES = [
  { key: 'temperature', unit: ' C',    decimals: 2, draw: 'continuous', axis: { name: 'C',    position: 'left'  } },
  { key: 'humidity',    unit: ' %',    decimals: 2, draw: 'continuous', axis: { name: '%',    position: 'left',  offset: 60 } },
  { key: 'ppm',         unit: ' ppm',  decimals: 0, draw: 'continuous', axis: { name: 'ppm',  position: 'right' } },
  { key: 'voc',         unit: '',      decimals: 0, draw: 'continuous', axis: { name: 'voc',  position: 'right', offset: 60 } },
  { key: 'pressure',    unit: ' hPa',  decimals: 2, draw: 'continuous', axis: { name: 'hPa',  position: 'left',  offset: 120 } },
  { key: 'vibration',   unit: ' m/s²', decimals: 2, draw: 'discrete',   axis: { name: 'm/s²', position: 'right', offset: 120 } },
];
const KEYS = SERIES.map(s => s.key);
const BY_KEY = Object.fromEntries(SERIES.map(s => [s.key, s]));

const chartData = {{.Data}};
for (const k of KEYS) chartData[k] = chartData[k] || [];

// A null datum is what breaks an ECharts line; it only bridges one when connectNulls
// is true, and that defaults to false.
//
// 10s is bounded on both sides by measured data: it has to clear the longest burst
// (7.6s over two days) or the line would break inside a spike, and every second
// beyond that leaves more real gaps joined (10s breaks 94% of them, 30s only 82%).
// Those figures are the pessimistic case, from before the detector stopped firing on
// its own noise; at a few dozen events a day the median gap is tens of minutes and
// almost anything in this range works. Erring low is the safer direction: a break
// inside one burst is a cosmetic blemish, and only lands where downsampling had
// already dropped the detail, whereas erring high redraws the artefact this removes.
const EVENT_GAP_MS = 10000;

function splitOnGaps(points) {
  const out = [];
  for (let i = 0; i < points.length; i++) {
    if (i && points[i][0] - points[i - 1][0] > EVENT_GAP_MS) {
      out.push([points[i - 1][0] + 1, null]);
    }
    out.push(points[i]);
  }
  return out;
}

// chartData itself stays raw so merging, sorting and latestTime() never see nulls;
// the drawing mode shapes it only on the way into the chart.
function seriesData(series) {
  return DRAW[series.draw].prepare(chartData[series.key]);
}

// ECharts paints a <canvas>, so it can't inherit the CSS color-scheme; read the
// OS preference here and use its built-in dark theme to match (picked at load).
const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
const chart = echarts.init(document.getElementById('chart'), prefersDark ? 'dark' : null);
chart.setOption({
  // No entry animation: with ~1k points/series ECharts otherwise "draws in" every
  // line over ~1s, which reads as the chart slowly populating on load. We want the
  // full dataset to snap in at once.
  animation: false,
  // Reuse the KPI colors from site.css so each line and its legend marker match the
  // big number up top; the KPI element ids are the series keys.
  color: KEYS.map(k => getComputedStyle(document.getElementById(k)).color),
  tooltip: { trigger: 'axis' },
  legend: { data: KEYS },
  xAxis: { type: 'time' },
  // scale: don't force zero into the range (pressure sits ~1013, not near 0);
  // boundaryGap: pad the data extent by 10% each side. With dataZoom's default
  // filterMode, each axis rescales to the data actually visible in the window.
  yAxis: SERIES.map(s => ({
    type: 'value', scale: true, boundaryGap: ['10%', '10%'], ...s.axis,
  })),
  dataZoom: [{ type: 'inside' }, { type: 'slider' }],
  series: SERIES.map((s, i) => ({
    name: s.key, type: 'line', yAxisIndex: i, data: seriesData(s),
    ...DRAW[s.draw].options,
  })),
});

// Keep a zoomed-in middle view anchored in time. ECharts stores the zoom window
// as percentages, so appended data would otherwise slide the view. We only let it
// auto-follow when the window's right edge is parked at the freshest sample.
const TAIL_EPS_MS = 2000;
let followTail = true;
let zoomWindow = null; // { start, end } absolute ms, set only while parked in the middle

function latestTime() {
  let max = null;
  for (const k of KEYS) {
    const arr = chartData[k];
    if (arr && arr.length) {
      const t = arr[arr.length - 1][0];
      if (max === null || t > max) max = t;
    }
  }
  return max;
}

let renderTask;
function renderChart() {
  clearTimeout(renderTask);
  renderTask = setTimeout(() => {
    const opt = { series: SERIES.map(s => ({ data: seriesData(s) })) };
    // Re-pin the absolute window so newly appended data can't scroll a middle view.
    if (!followTail && zoomWindow) {
      opt.dataZoom = [{ startValue: zoomWindow.start, endValue: zoomWindow.end }];
    }
    chart.setOption(opt);
  }, 1);
}

function mergeUpdates(update) {
  for (const k of KEYS) {
    const m = new Map();
    (chartData[k] || []).forEach(e => m.set(e[0], e[1]));
    (update[k] || []).forEach(e => m.set(e[0], e[1]));
    chartData[k] = [...m.keys()].sort((a, b) => a - b).map(t => [t, m.get(t)]);
  }
  renderChart();
}

let fetchTask;
function scheduleFetch(start, end) {
  clearTimeout(fetchTask);
  fetchTask = setTimeout(() => fetchUpdates(start, end), 100);
}
function fetchUpdates(start, end) {
  let url = location.pathname + '/partial';
  const q = [];
  if (start != null) q.push('start=' + Math.floor(start));
  if (end != null) q.push('end=' + Math.ceil(end));
  if (q.length) url += '?' + q.join('&');
  fetch(url)
    .then(r => { if (r.status === 401) { location.reload(); return null; } return r.json(); })
    .then(d => { if (d) mergeUpdates(d); });
}

chart.on('datazoom', () => {
  const dz = chart.getOption().dataZoom[0];
  scheduleFetch(dz.startValue, dz.endValue);
  // Follow the tail iff the window's right edge is at (or near) the newest sample;
  // otherwise remember the absolute window so renderChart keeps it fixed.
  const maxT = latestTime();
  followTail = maxT === null || dz.endValue == null || dz.endValue >= maxT - TAIL_EPS_MS;
  zoomWindow = (!followTail && dz.startValue != null && dz.endValue != null)
    ? { start: dz.startValue, end: dz.endValue }
    : null;
});

function updateKpi(key, value) {
  const el = document.getElementById(key);
  if (!el) return;
  el.textContent = value.toFixed(BY_KEY[key].decimals) + BY_KEY[key].unit;
}

// SSE stream of live readings. EventSource auto-reconnects (and handles
// backgrounded tabs) on its own, so there is no manual reconnect/keepalive.
let firstConnect = true;
const es = new EventSource(location.pathname + '/realtime');
es.onmessage = e => {
  const m = JSON.parse(e.data);
  for (const k of KEYS) {
    if (m[k] !== undefined) { chartData[k].push([m.receivedAt, m[k]]); updateKpi(k, m[k]); }
  }
  renderChart();
};
es.onopen = () => {
  if (firstConnect) { firstConnect = false; return; } // page already rendered {{.Data}}
  fetchUpdates(); // backfill the gap after an auto-reconnect
};
window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
